<div id="principal">
    <app-menusuperior></app-menusuperior>
    <app-menulateral [menu_item]="1.8"></app-menulateral>
    <main id="main" class="main">
        <div class="pagetitle">
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a role="button" [routerLink]="['/inicio']">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Bit&aacute;cora</li>
                </ol>
            </nav>
        </div>
        <div class="card">
            <div *ngIf="ver_bitacora && tokenDetalle.asgard_almacen" class="card-body">
                <br />
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="idcliente" class="form-label text-secondary small">Cliente</label>
                        <ng-select name="idcliente" id="idcliente" [items]="entidades" 
                            bindLabel="entidad" 
                            bindValue="id_num"
                            placeholder="Todos"
                            [(ngModel)]="idcliente"
                            (change)="error_idcliente=false"
                        >
                        </ng-select>
                        <small *ngIf="error_idcliente" class="text-danger">Campo Obligatorio</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="chasis" class="form-label text-secondary small">Chasis</label>
                        <input type="text" class="form-control" id="chasis" name="chasis" [(ngModel)]="chasis" (change)="error_chasis=false;" >
                        <small *ngIf="error_chasis" class="text-danger">Campo Obligatorio</small>
                    </div>
                    
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <button type="button" class="btn btn-primary col-12" (click)="verBitacora();" [disabled]="generado">Buscar</button>
                    </div>
                </div>
                <br />
                <app-inventario-fisico-bitacora *ngIf="bitacora_visible" [chasis]="chasis" [idcliente]="idcliente"></app-inventario-fisico-bitacora>
            </div>
        </div>
    </main>
</div>
