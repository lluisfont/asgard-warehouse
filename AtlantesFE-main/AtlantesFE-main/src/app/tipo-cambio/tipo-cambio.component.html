<div id="principal">
    <app-menusuperior></app-menusuperior>
    <app-menulateral [menu_item]="9.2"></app-menulateral>
    <main id="main" class="main">
        <div class="pagetitle">
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a role="button" [routerLink]="['/inicio']">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Tipo de Cambio</li>
                </ol>
            </nav>
        </div>
        <div class="card">
            <div *ngIf="ver_tipo_cambio" class="card-body">
                <br />
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="fecha" class="form-label text-secondary small">Fecha</label>
                        <input type="date" class="form-control" id="fecha" name="fecha" max="{{fecha_actual}}" [(ngModel)]="fecha" (change)="cargarTipoCambio();" >
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-12">
                        <div class="accordion" id="accordionExample">
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingOne">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                        Divisas
                                    </button>
                                </h2>
                                <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                                    <div class="accordion-body">
                                        <div class="row">
                                            <div *ngFor="let divisa of divisas" class="col-md-4">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" id="iddivisa-{{divisa.iddivisa}}" [checked]="divisa.marcado" (change)="divisa.marcado=!divisa.marcado; cargarTipoCambio()">
                                                    <label class="form-check-label" for="iddivisa-{{divisa.iddivisa}}">
                                                        {{divisa.codigo}}
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <br />
                
                <div class="row">
                    <div class="col-12">
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="mantener_relacion" [checked]="mantener_relacion" (change)="mantener_relacion = !mantener_relacion" [disabled]="!editar_tipo_cambio">
                            <label class="form-check-label" for="mantener_relacion">Mantener Relaci&oacute;n</label>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <tr *ngFor="let divisaorigen of divisas">
                            <ng-container *ngIf="divisaorigen.marcado">
                                <th scope="row">1 {{divisaorigen.codigo}} =</th>
                                <td *ngFor="let divisadestino of divisas">
                                    <ng-container *ngIf="divisadestino.marcado">
                                        <ng-container *ngFor="let tipocambio of tiposcambio">
                                            <ng-container *ngIf="tipocambio.iddivisaorigen==divisaorigen.iddivisa && tipocambio.iddivisadestino==divisadestino.iddivisa">
                                                <!--<input type="number" step="0.00001" class="form-control" name="tipocambio-{{tipocambio.iddivisaorigen}}-{{tipocambio.iddivisadestino}}" id="tipocambio-{{tipocambio.iddivisaorigen}}-{{tipocambio.iddivisadestino}}" [(ngModel)]="tipocambio.tipocambio" [disabled]="divisaorigen.iddivisa==divisadestino.iddivisa" />-->
                                                <div class="input-group">
                                                    <input type="number" step="0.00001" class="form-control" name="tipocambio-{{tipocambio.iddivisaorigen}}-{{tipocambio.iddivisadestino}}" id="tipocambio-{{tipocambio.iddivisaorigen}}-{{tipocambio.iddivisadestino}}" [(ngModel)]="tipocambio.tipocambio" [disabled]="desactivarTipoCambio(divisaorigen.iddivisa,divisadestino.iddivisa)" (input)="calculoOpuesto(divisaorigen.iddivisa,divisadestino.iddivisa)" />
                                                    <span class="input-group-text" id="basic-addon2">{{divisadestino.codigo}}</span>
                                                </div>
                                            </ng-container>

                                        </ng-container>
                                    </ng-container>
                                </td>
                            </ng-container>
                        </tr>
                    </table>
                </div>
                <br />
                <button *ngIf="editar_tipo_cambio" type="button" class="btn btn-primary" (click)="guardarDatos();">Guardar</button>
            </div>
        </div>
    </main>
</div>
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" [ngClass]="toast_tipo == 'Exito' ? 'toast align-items-center text-white bg-success border-0' : 'toast align-items-center text-white bg-danger text-white border-0'" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <strong>{{toast_tipo}}</strong><br />{{toast_mensaje}}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
