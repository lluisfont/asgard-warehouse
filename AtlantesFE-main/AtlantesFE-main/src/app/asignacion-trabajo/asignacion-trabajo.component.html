<div id="principal">
    <app-menusuperior [permite_cambio_almacen]="true"></app-menusuperior>
    <app-menulateral [menu_item]="12.2"></app-menulateral>
    <main id="main" class="main">
        <div class="pagetitle">
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a role="button" [routerLink]="['/inicio']">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Asignaci&oacute;n de Trabajo</li>
                </ol>
            </nav>
        </div>
        <div>
                    <div class="row g-3">
                        <!-- Total VINs -->
                        <div class="col-md-3">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body d-flex align-items-center">
                                    <div class="rounded p-3 me-3 bg-primary bg-opacity-10">
                                        <i class="bi bi-box text-primary fs-4"></i>
                                    </div>
                                    <div>
                                        <div class="text-muted small">Total VINs</div>
                                        <div class="fs-4 fw-bold">{{total_vin}}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Pendientes -->
                        <div class="col-md-3">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body d-flex align-items-center">
                                    <div class="rounded p-3 me-3 bg-warning bg-opacity-10">
                                        <i class="bi bi-calendar text-warning fs-4"></i>
                                    </div>
                                    <div>
                                        <div class="text-muted small">Asignados</div>
                                        <div class="fs-4 fw-bold">{{total_asignado}}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- En Recepción -->
                        <div class="col-md-3">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body d-flex align-items-center">
                                    <div class="rounded p-3 me-3 bg-success bg-opacity-10">
                                        <i class="bi bi-clipboard-check text-success fs-4"></i>
                                    </div>
                                    <div>
                                        <div class="text-muted small">Pendientes</div>
                                        <div class="fs-4 fw-bold">{{total_pendiente}}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card shadow-sm border-0 h-100">
                                <div class="card-body d-flex align-items-center">
                                    <div class="rounded p-3 me-3 bg-success bg-opacity-10">
                                        <i class="bi bi-clipboard-check text-success fs-4"></i>
                                    </div>
                                    <div>
                                        <div class="text-muted small">Seleccionados</div>
                                        <div class="fs-4 fw-bold">{{total_seleccionado}}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <br />
        <div class="card">
            <div *ngIf="ver_asignacion_trabajo" class="card-body">
                <br />
                <ng-container *ngIf="existe_marcado">
                    <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                        <button type="button" class="btn btn-dark" (click)="prepararTecnico()">Asignar T&eacute;cnico Principal</button>
                        <button type="button" class="btn btn-info" (click)="prepararTecnicoQA()">Asignar T&eacute;cnico QA</button>
                    </div>
                    <br /><br />
                </ng-container>
                
                
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-dark" (click)="marcarTodo()">{{texto_seleccion}}</button>
                </div>
                <br />
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="filtro_chasis" class="form-label text-secondary small">Buscar VIN</label>
                        <input type="text" class="form-control" id="filtro_chasis" name="filtro_chasis" (input)="filtrarAsignacionTrabajo()" [(ngModel)]="filtro_chasis" >
                    </div>
                </div>
                
                <div class="list-group">
                    <label class="list-group-item" *ngFor="let asignacion_trabajo of asignaciontrabajo_filtrado; let rowIndex = index">
                        
                        <div class="row">
                            <div class="col-md-3 d-flex align-items-start">
                                <input class="form-check-input me-2 mt-1" type="checkbox" [disabled]="(asignacion_trabajo.idestado_etapa>=2)" [checked]="asignacion_trabajo.marcado" (click)="validarMarcado(rowIndex)">
                                <div>
                                    <div class="fw-semibold">VIN</div>
                                    <div class="text-muted">{{asignacion_trabajo.chasis}}</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="fw-semibold">Marca</div>
                                <div class="text-muted">{{asignacion_trabajo.marca}}</div>
                                <div class="text-muted">{{asignacion_trabajo.modelo}}</div>
                            </div>
                            <div class="col-md-2">
                                <div class="fw-semibold">Etapa</div>
                                <p-tag [severity]="asignacion_trabajo.severity" value="{{asignacion_trabajo.etapa}}"/>
                                <div class="fw-semibold">Tipo de Tanque</div>
                                <div class="text-muted">{{asignacion_trabajo.tipo_tanque}}</div>
                                <div>
                                    UBI: <span class="text-muted">{{asignacion_trabajo.ubicacion}}</span>
                                </div>
                                    
                            </div>
                            <div class="col-md-2">
                                <div class="fw-semibold">Tecnicos</div>
                                <ul>
                                    <li *ngFor="let tecnico of asignacion_trabajo.tecnicos; let rowIndexTecnico = index">
                                        {{tecnico.nombre}} <button *ngIf="asignacion_trabajo.idestado_etapa<2" [disabled]="cargando" type="button" class="btn btn-light btn-sm" (click)="eliminarTecnico(rowIndex,rowIndexTecnico)"><i class="bi bi-x"></i></button>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-md-2">
                                <div class="fw-semibold">Tecnicos QA</div>
                                <ul>
                                    <li *ngFor="let tecnico_qa of asignacion_trabajo.tecnicos_qa; let rowIndexTecnicoQa = index">
                                        {{tecnico_qa.nombre}} <button *ngIf="asignacion_trabajo.idestado_etapa<2" [disabled]="cargando" type="button" class="btn btn-light btn-sm" (click)="eliminarTecnicoQA(rowIndex,rowIndexTecnicoQa)"><i class="bi bi-x"></i></button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
        </div>
    </main>
</div>

<p-dialog #modal_tecnico header="Asignar Técnicos" [modal]="true" [(visible)]="visible_tecnico" [style]="{ width: '50rem' }">
    <label for="filtro_tecnico" class="form-label text-secondary small" (input)="filtrarTecnicos()">Buscar T&eacute;cnico</label>
    <input type="text" class="form-control" id="filtro_tecnico" name="filtro_tecnico" (input)="filtrarTecnicos()" [(ngModel)]="filtro_tecnico" >
    Seleccione t&eacute;cnicos (m&aacute;ximo 2)
    <div class="row p-3">
        <ng-container *ngFor="let tecnico of tecnicos">
            <div *ngIf="tecnico.mostrar" class="col-md-4 p-1 field-checkbox">
                    <p-checkbox 
                    [(ngModel)]="tecnico.marcado"
                    [binary]="true"
                    [label]="tecnico.nombre" 
                    name="tecnico" 
                    [disabled]="cargando"
                    [value]="tecnico.idusuario" />
            </div>
        </ng-container>
        
    </div>
    <hr />
    <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary" [disabled]="cargando" (click)="visible_tecnico = false">Cerrar</button>&nbsp;
        <button type="button" class="btn btn-primary" [disabled]="cargando" (click)="asignarTecnico()">Confirmar Asignaci&oacute;n</button>
    </div>
</p-dialog>

<p-dialog #modal_tecnico_qa header="Asignar Técnicos QA" [modal]="true" [(visible)]="visible_tecnico_qa" [style]="{ width: '50rem' }">
    Seleccione t&eacute;cnicos QA
    <div class="row p-3">
        <div *ngFor="let tecnico_qa of tecnicos_qa" class="col-md-4 p-1 field-checkbox">
            <p-checkbox 
                [(ngModel)]="tecnico_qa.marcado"
                [binary]="true"
                [label]="tecnico_qa.nombre" 
                name="tecnico_qa" 
                [disabled]="cargando"
                [value]="tecnico_qa.idusuario" />
        </div>
    </div>
    <hr />
    <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary" [disabled]="cargando" (click)="visible_tecnico_qa = false">Cerrar</button>&nbsp;
        <button type="button" class="btn btn-primary" [disabled]="cargando" (click)="asignarTecnicoQA()">Confirmar Asignaci&oacute;n</button>
    </div>
</p-dialog>
