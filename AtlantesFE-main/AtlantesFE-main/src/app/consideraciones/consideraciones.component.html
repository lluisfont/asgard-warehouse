<div id="principal">
    <app-menusuperior></app-menusuperior>
    <app-menulateral [menu_item]="11.6"></app-menulateral>
    <main id="main" class="main">
        <div class="pagetitle">
            <!--<h1>Cotizaciones</h1>-->
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a role="button" [routerLink]="['/inicio']">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Consideraciones</li>
                </ol>
            </nav>
        </div>
        <div class="card">
            <div *ngIf="ver_consideraciones
                " class="card-body">
                <br />
                <div class="row">
                    <div class="col-md-9"><button *ngIf="editar_consideraciones" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ventanaConsideracion" (click)="prepararDatos(0)">Nueva Consideraci&oacute;n</button></div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="filtro" [(ngModel)]="filtro" placeholder="Buscar" (keyup)="p=1">
                    </div>
                </div>
                <br />
                
                
                <div class="list-group">
                    <ng-container *ngFor="let consideracion of consideraciones | appFilter: filtro: '' | paginate: { itemsPerPage: items, currentPage: p, id: 'page' }">
                        <a role="button" class="list-group-item list-group-item-action" data-bs-toggle="modal" data-bs-target="#ventanaConsideracion" (click)="prepararDatos(consideracion.idconsideraciones)">
                            <div class="row">
                                <div class="col">
                                    {{consideracion.consideraciones}}
                                </div>
                            </div>
                        </a>
                    </ng-container>
                </div>
                <br />
                <div class="row">
                    <div class="col-md-10">
                        <pagination-controls 
                            (pageChange)="p = $event"  
                            id="page"
                            nextLabel="Sig"
                            previousLabel="Ant"
                            >
                        </pagination-controls>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" [(ngModel)]="items" name="items" (change)="p=1">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal" id="ventanaConsideracion" tabindex="-1" aria-labelledby="ventanaConsideracionLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ventanaConsideracionLabel">{{cabecera_modal}} Consideraci&oacute;n</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <br />
                <div class="row mb-3">
                    <div class="col">
                        <label for="consideracion" class="form-label text-secondary small">Consideraci&oacute;n</label>
                        <textarea class="form-control" id="consideracion" name="consideracion" rows="6" [(ngModel)]="consideracion" (change)="error_consideracion=false" [disabled]="!editar_consideraciones"></textarea>
                        <!--<input type="text" class="form-control" id="consideracion" name="consideracion" [(ngModel)]="consideracion" (change)="error_consideracion=false" [disabled]="!editar_consideraciones" />-->
                        <small *ngIf="error_consideracion" class="text-danger">Campo Obligatorio</small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button *ngIf="editar_consideraciones" type="button" class="btn btn-primary" (click)="guardarDatos();">Guardar</button>
            </div>
        </div>
    </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" [ngClass]="toast_tipo == 'Exito' ? 'toast align-items-center text-white bg-success border-0' : 'toast align-items-center text-white bg-danger text-white border-0'" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <strong>{{toast_tipo}}</strong><br />{{toast_mensaje}}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
